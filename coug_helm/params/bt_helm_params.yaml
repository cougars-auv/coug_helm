bt_helm_node:
  origin_topic:
    type: string
    default_value: "/origin"
  waypoint_topic:
    type: string
    default_value: "waypoints"
  odom_topic:
    type: string
    default_value: "odometry/global"
  heading_topic:
    type: string
    default_value: "heading"
  speed_topic:
    type: string
    default_value: "speed"
  depth_topic:
    type: string
    default_value: "depth"
  publish_diagnostics:
    type: bool
    default_value: false

  tick_rate_ms:
    type: int
    default_value: 50

  capture_radius:
    type: double
    default_value: 25.0
  slip_radius:
    type: double
    default_value: 50.0
  desired_speed_rpm:
    type: double
    default_value: 1500.0
  odom_timeout_sec:
    type: double
    default_value: 2.0

  publish_groot2:
    type: bool
    default_value: true
  groot2_port:
    type: int
    default_value: 1667
