bt_helm_node:
  tick_rate_hz:
    type: double
    default_value: 20.0
    validation:
      gt<>: [0.0]
  publish_diagnostics:
    type: bool
    default_value: false
  surface_capture_radius:
    type: double
    default_value: 1000.0
    validation:
      gt_eq<>: [0.1]
  surface_capture_radius_z:
    type: double
    default_value: 0.5
    validation:
      gt_eq<>: [0.1]
  home_capture_radius:
    type: double
    default_value: 25.0
    validation:
      gt_eq<>: [0.1]
  home_capture_radius_z:
    type: double
    default_value: 0.5
    validation:
      gt_eq<>: [0.1]
  surface_slip_radius:
    type: double
    default_value: 1000.0
    validation:
      gt_eq<>: [0.1]
  surface_slip_radius_z:
    type: double
    default_value: 0.5
    validation:
      gt_eq<>: [0.1]
  home_slip_radius:
    type: double
    default_value: 50.0
    validation:
      gt_eq<>: [0.1]
  home_slip_radius_z:
    type: double
    default_value: 0.5
    validation:
      gt_eq<>: [0.1]
  default_speed_rpm:
    type: double
    default_value: 1500.0
    validation:
      bounds<>: [0.0, 1525.0]
  odom_timeout_sec:
    type: double
    default_value: 2.0
    validation:
      gt<>: [0.0]
  odom_recovery_timeout_sec:
    type: double
    default_value: 30.0
    validation:
      gt_eq<>: [0.0]
  progress_timeout_sec:
    type: double
    default_value: 15.0
    validation:
      gt_eq<>: [0.0]
  progress_threshold:
    type: double
    default_value: 0.5
    validation:
      gt_eq<>: [0.0]
  number_of_retries:
    type: int
    default_value: 6
    validation:
      gt_eq<>: [0]
  wait_duration_sec:
    type: double
    default_value: 5.0
    validation:
      gt_eq<>: [0.0]
  publish_groot2:
    type: bool
    default_value: false
  groot2_port:
    type: int
    default_value: 1667
    validation:
      bounds<>: [1024, 65535]
  waypoint_topic:
    type: string
    default_value: "waypoints"
    validation:
      not_empty<>: []
  odom_topic:
    type: string
    default_value: "odometry/global"
    validation:
      not_empty<>: []
  hsd_topic:
    type: string
    default_value: "cmd_hsd"
    validation:
      not_empty<>: []
  start_service:
    type: string
    default_value: "start"
    validation:
      not_empty<>: []
  stop_service:
    type: string
    default_value: "stop"
    validation:
      not_empty<>: []
  surface_service:
    type: string
    default_value: "surface"
    validation:
      not_empty<>: []
  home_service:
    type: string
    default_value: "home"
    validation:
      not_empty<>: []
  emergency_stop_service:
    type: string
    default_value: "emergency_stop"
    validation:
      not_empty<>: []
  emergency_surface_service:
    type: string
    default_value: "emergency_surface"
    validation:
      not_empty<>: []
  arm_thruster_service:
    type: string
    default_value: "thruster/arm"
    validation:
      not_empty<>: []
  reset_localization_service:
    type: string
    default_value: "factor_graph_node/reset"
    validation:
      not_empty<>: []
